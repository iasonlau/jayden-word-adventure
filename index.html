<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173b36">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="字字探險隊">
  <meta name="description" content="以香港廣東話學習繁體中文的兒童冒險遊戲">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./adventure.css">
  <link rel="stylesheet" href="./game.css">
  <style>button:focus-visible,textarea:focus-visible,canvas:focus-visible{outline:4px solid #ffbd33;outline-offset:4px}</style>
  <title>字字探險隊｜廣東話認字大冒險</title>
</head>
<body>
  <div class="sky" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <main class="app-shell">
    <header class="topbar">
      <button class="brand" id="brandHome" aria-label="返回探險基地"><span class="brand-mark">字</span><span>字字探險隊</span></button>
      <div class="player-stats" aria-label="探險進度">
        <span class="stat-pill" title="星星"><span aria-hidden="true">⭐</span><b id="starCount">0</b></span>
        <span class="stat-pill" id="status">探險基地</span>
      </div>
    </header>
    <div id="root" aria-live="polite"></div>
    <nav class="dock" id="dock" aria-label="主要選單">
      <button data-route="home"><span>🏕️</span>基地</button>
      <button data-route="map"><span>🗺️</span>地圖</button>
      <button data-route="daily"><span>🎯</span>每日</button>
      <button data-route="parent"><span>👨‍👩‍👦</span>家長</button>
    </nav>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <div id="celebration" class="celebration" aria-hidden="true"></div>
  <script src="./game.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
