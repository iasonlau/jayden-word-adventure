function setupCanvas(){const c=document.getElementById('pad'),ctx=c.getContext('2d');ctx.lineWidth=6;ctx.strokeStyle='#283f62';ctx.lineCap='round';ctx.lineJoin='round';let down=false;const pos=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};c.onpointermove=e=>{if(!down)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};c.onpointerup=()=>down=false;c.onpointercancel=()=>down=false;document.getElementById('clear').onclick=()=>ctx.clearRect(0,0,c.width,c.height)}
function report(){let groups=['聽','說','讀','理解','寫'];let summaries=groups.map(type=>{const a=state.answers.filter(x=>x.type===type);const max=a.length*2;const score=a.reduce((s,x)=>s+x.score,0);return{type,score,max,pct:max?Math.round(score/max*100):0}});const total=state.answers.reduce((s,x)=>s+x.score,0),max=state.answers.length*2;const label={聽:'聽力理解',說:'口語表達',讀:'認字詞義',理解:'句子與題目理解',寫:'書寫能力'};let weak=summaries.filter(x=>x.pct<65).sort((a,b)=>a.pct-b.pct);root.innerHTML=`<section class="panel"><div class="hero"><div class="emoji">🏆</div><h1>探險完成！</h1><p>Jayden 已完成 50 題能力任務，以下係學習起點參考。</p></div><h2>能力分項報告</h2>${summaries.map(x=>`<div style="margin:18px 0"><div class="row"><b>${label[x.type]}</b><span>${x.score} / ${x.max} 分 · ${x.pct}%</span></div><div class="bar"><span style="width:${x.pct}%"></span></div></div>`).join('')}<div class="help"><b>建議先練習：</b>${weak.length?weak.slice(0,2).map(x=>label[x.type]).join('、'):'各範疇均可循序提升'}。<br>每日 10–15 分鐘：先複習熟悉詞語，再學 3 個新詞，最後用一個小遊戲練習題目理解。</div><p class="help">家長提示：分項分數只反映本次題庫表現，並非年級百分位。若聽力明顯高於閱讀，可先加強字詞辨認；若兩者均困難，先用生活圖片配合口語理解練習。</p><p class="muted small">這是家庭練習用的初步篩查，不是標準化測驗、診斷或年級常模。口語及書寫由家長評分，結果會受評分準則、提示和裝置影響。</p><div class="actions"><button class="btn" id="download">下載評估報告（文字）</button><button class="btn secondary" id="home">返回首頁</button><button class="btn warn" id="reset">重新評估</button></div></section>`;document.getElementById('home').onclick=()=>{state.started=false;save();render()};document.getElementById('reset').onclick=resetAll;document.getElementById('download').onclick=()=>{const s=`字字探險隊｜Jayden 能力評估\n日期：${new Date().toLocaleDateString('zh-HK')}\n完成題數：${state.answers.length}\n${summaries.map(x=>`${label[x.type]}：${x.score}/${x.max} (${x.pct}%)`).join('\n')}\n建議優先：${weak.slice(0,2).map(x=>label[x.type]).join('、')||'持續均衡練習'}\n\n注意：非標準化診斷工具，請結合老師觀察。`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/plain;charset=utf-8'}));a.download='字字探險隊_Jayden_評估報告.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}}
function resetAll(){if(!confirm('確定清除現有評估紀錄，重新開始？'))return;state={index:0,answers:[],started:false,finished:false};save();render()};render();

const LEARNKEY='zizi_learning_v1';
let learning={stars:0,known:{},mistakes:{},sessions:0,custom:[]};try{const v=JSON.parse(localStorage.getItem(LEARNKEY)||'null');if(v)learning={...learning,...v}}catch(e){}
const saveLearning=()=>{try{localStorage.setItem(LEARNKEY,JSON.stringify(learning))}catch(e){}};
let lessonMode='listen',lessonIndex=0,lessonRight=0,lessonTotal=0,lessonAnswered=false;
const lessons=[{name:'學校與課堂',start:0,end:18},{name:'題目關鍵詞',start:18,end:32},{name:'位置與時間',start:32,end:48},{name:'閱讀與表達',start:48,end:64},{name:'生活與家庭',start:64,end:100},{name:'概念與數量',start:100,end:140},{name:'進階詞語',start:140,end:vocab.length}];
function learningHome(){state.started=false;save();document.getElementById('status').textContent='每日學習';root.innerHTML=`<section class="panel"><div class="hero"><div class="emoji">📚✨</div><h1>每日認字樂園</h1><p>每日學 3 個新詞，玩一小局，慢慢進步。</p><b>⭐ ${learning.stars} 顆星星 · 已認識 ${Object.keys(learning.known).length} 詞</b></div><h2>揀一個學習世界</h2><div class="grid">${lessons.map((l,i)=>`<button class="tile" data-lesson="${i}">🏝️ ${l.name}<div class="muted small">${l.end-l.start} 個詞語</div></button>`).join('')}</div><h2>六款小遊戲</h2><div class="grid">${[['listen','👂 聽聲選詞'],['meaning','🔍 詞語意思'],['match','🧩 字詞配對'],['order','🚂 句子排序'],['detective','📖 閱讀偵探'],['write','✍️ 寫字挑戰']].map(([k,t])=>`<button class="tile" data-mode="${k}">${t}</button>`).join('')}</div><div class="actions"><button class="btn secondary" id="backassess">返回能力評估</button><button class="btn secondary" id="parentview">家長中心</button></div></section>`;document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>startLearning('listen',Number(b.dataset.lesson)));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>startLearning(b.dataset.mode,0));document.getElementById('backassess').onclick=()=>{state.started=false;render()};document.getElementById('parentview').onclick=parentView}
function startLearning(mode,unit){lessonMode=mode;lessonIndex=0;lessonRight=0;lessonTotal=5;const l=lessons[unit];const base=vocab.slice(l.start,l.end);const pool=base.length>=4?base:vocab;window.lessonWords=Array.from({length:5},(_,i)=>pool[(learning.sessions*3+i)%pool.length]);window.lessonPool=pool;learning.sessions++;saveLearning();renderLearning()}
function renderLearning(){document.getElementById('status').textContent='遊戲 '+(lessonIndex+1)+'/5';if(lessonIndex>=lessonTotal){root.innerHTML=`<section class="panel"><div class="hero"><div class="emoji">🏆🌟</div><h1>今日完成！</h1><p>你答啱 ${lessonRight} / ${lessonTotal} 題，獲得 ${lessonRight} 顆星星！</p></div><button class="btn" id="again">返回認字樂園</button></section>`;document.getElementById('again').onclick=learningHome;return}const w=window.lessonWords[lessonIndex],pool=window.lessonPool;lessonAnswered=false;let answer=w,question='',choices=[];const alt=pool.filter(x=>x!==w).slice(0,3);if(lessonMode==='listen'){question='聽清楚讀音，揀出正確詞語。';choices=[w,...alt]}else if(lessonMode==='meaning'){question='請揀出同「'+w+'」相同嘅詞語。';choices=[w,...alt]}else if(lessonMode==='match'){question='請配對相同詞語：'+w;choices=[w,...alt]}else if(lessonMode==='order'){question='請將句子補充完整：「我正在學習＿＿。」';answer='中文';choices=['中文','睡覺','天空','雨傘'];}else if(lessonMode==='detective'){question='老師說：「請圈出正確答案。」你應該做甚麼？';answer='圈選正確的一項';choices=[answer,'把所有答案擦掉','不看題目','只畫一幅畫']}else{question='請聽讀音，再用手指寫出詞語。';choices=[]}
choices=choices.sort((a,b)=>((a.charCodeAt(0)+lessonIndex*13)%7)-((b.charCodeAt(0)+lessonIndex*13)%7));let h=`<section class="panel"><div class="row"><span class="section">🎮 ${lessonMode==='write'?'寫字挑戰':'認字遊戲'}</span><span>${lessonIndex+1}/5</span></div><div class="progress"><div style="width:${lessonIndex/5*100}%"></div></div><div class="big">${question}</div><button class="btn secondary" id="readword">🔊 聽廣東話</button><p id="voiceNote" class="muted small"></p>`;if(lessonMode==='write')h+=`<canvas id="pad" width="760" height="240"></canvas><div class="actions"><button class="btn secondary" id="clear">清除</button><button class="btn secondary" id="showword">揭曉詞語</button></div><p class="muted hidden" id="wordtarget">${w}</p><p>家長評分：</p><div class="grid"><button class="tile" data-ans="yes">🌟 能寫出</button><button class="tile" data-ans="no">💡 需要練習</button></div>`;else h+=`<div class="grid" style="margin-top:18px">${choices.map(c=>`<button class="tile" data-ans="${c}">${c}</button>`).join('')}</div>`;h+=`<p id="feedback" class="help hidden"></p><div class="actions"><button class="btn" id="continue" disabled>下一題 →</button><button class="btn secondary" id="leavegame">返回樂園</button></div></section>`;root.innerHTML=h;document.getElementById('readword').onclick=()=>speak(lessonMode==='detective'?question:lessonMode==='order'?question:w);document.getElementById('leavegame').onclick=learningHome;document.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>{if(lessonAnswered)return;lessonAnswered=true;let right=lessonMode==='write'?b.dataset.ans==='yes':b.dataset.ans===answer;lessonRight+=right?1:0;learning.stars+=right?1:0;if(right)learning.known[w]=(learning.known[w]||0)+1;else learning.mistakes[w]=(learning.mistakes[w]||0)+1;saveLearning();document.querySelectorAll('[data-ans]').forEach(x=>{x.disabled=true;x.classList.toggle('correct',x.dataset.ans===(lessonMode==='write'?'yes':answer))});const fb=document.getElementById('feedback');fb.classList.remove('hidden');fb.textContent=right?'🌟 做得好！':'💡 今次記住「'+answer+'」，下次再挑戰！';document.getElementById('continue').disabled=false});document.getElementById('continue').onclick=()=>{lessonIndex++;renderLearning()};if(lessonMode==='write'){setupCanvas();document.getElementById('showword').onclick=()=>document.getElementById('wordtarget').classList.remove('hidden')}}
function parentView(){document.getElementById('status').textContent='家長中心';const missed=Object.entries(learning.mistakes).sort((a,b)=>b[1]-a[1]).slice(0,12);root.innerHTML=`<section class="panel"><h1>👨‍👩‍👦 家長中心</h1><p>累積星星：${learning.stars} · 已練習掌握詞語：${Object.keys(learning.known).length} / ${vocab.length} · 遊戲局數：${learning.sessions}</p><h2>需要複習嘅詞語</h2><p>${missed.length?missed.map(x=>x[0]+'（'+x[1]+'次）').join('、'):'暫時未有錯題紀錄'}</p><h2>加入學校詞語</h2><textarea id="customwords" placeholder="每行一個詞語，例如：郊遊"></textarea><div class="actions"><button class="btn" id="addwords">加入詞庫</button><button class="btn secondary" id="exportdata">備份進度</button><button class="btn secondary" id="backlearn">返回樂園</button></div><p class="muted small">學習資料只儲存於本裝置瀏覽器，清除網站資料可能會遺失。</p></section>`;document.getElementById('addwords').onclick=()=>{const arr=document.getElementById('customwords').value.split(/[,，\n]/).map(x=>x.trim()).filter(x=>x.length>0&&x.length<=12);learning.custom=[...new Set([...learning.custom,...arr])].slice(0,100);saveLearning();alert('已加入 '+arr.length+' 個詞語（保存在家長詞庫）')};document.getElementById('exportdata').onclick=()=>{const payload={assessment:state,learning,date:new Date().toISOString()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zizi-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('backlearn').onclick=learningHome}
function injectLearningButton(){if(document.getElementById('learning-entry'))return;const b=document.createElement('button');b.id='learning-entry';b.className='btn';b.textContent='📚 每日認字樂園';b.style.marginTop='14px';b.onclick=learningHome;const panel=root.querySelector('.panel');if(panel)panel.appendChild(b)}
const originalRender=render;render=function(){originalRender();if(!state.started)injectLearningButton()};render();
