name: Generate Azure Cantonese voices

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: azure-cantonese-voices
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate HiuMaan and WanLung audio
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: node scripts/generate-azure-voices.mjs
      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio
          git diff --cached --quiet && exit 0
          git commit -m "Generate Azure Cantonese voice pack"
          git push
